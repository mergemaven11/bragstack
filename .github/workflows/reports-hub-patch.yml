name: Reports Hub branch patch

on:
  push:
    branches:
      - feature/reports-hub-v1

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reports-hub-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wire Reports Hub and receipt visibility into App
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/App.jsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing App.jsx patch target: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'import LandingPage from "./LandingPage";\n',
              'import LandingPage from "./LandingPage";\nimport ReportsPage from "./ReportsPage";\n',
              'ReportsPage import',
          )

          replace_once(
              '  updateCurrentUserProfile,\n  updateEntry,\n',
              '  updateCurrentUserProfile,\n  updateImpactReceipt,\n  updateEntry,\n',
              'updateImpactReceipt import',
          )

          replace_once(
              '  const [receiptError, setReceiptError] = useState("");\n',
              '  const [receiptError, setReceiptError] = useState("");\n  const [updatingReceiptId, setUpdatingReceiptId] = useState(null);\n',
              'receipt update state',
          )

          replace_once(
              '  const isRegisterPage = path === "/register";\n',
              '  const isRegisterPage = path === "/register";\n  const isReportsPage = path === "/app/reports";\n',
              'reports path',
          )

          replace_once(
              '      isLoginPage ||\n      isRegisterPage\n',
              '      isLoginPage ||\n      isRegisterPage ||\n      isReportsPage\n',
              'reports effect skip',
          )

          replace_once(
              '    isLoginPage,\n    isRegisterPage,\n  ]);\n',
              '    isLoginPage,\n    isRegisterPage,\n    isReportsPage,\n  ]);\n',
              'reports effect dependency',
          )

          handler = '''  async function handleToggleReceiptVisibility(receipt) {\n    setUpdatingReceiptId(receipt.id);\n    setReceiptNotice("");\n    setReceiptError("");\n\n    try {\n      const nextVisibility = !receipt.is_public;\n\n      await updateImpactReceipt(receipt.id, {\n        is_public: nextVisibility,\n      });\n\n      await loadDashboard();\n      setReceiptNotice(\n        nextVisibility\n          ? "Impact Receipt is now public."\n          : "Impact Receipt is now private."\n      );\n    } catch (error) {\n      console.error(error);\n      setReceiptError(\n        error.response?.data?.detail ??\n          "Receipt visibility could not be updated."\n      );\n    } finally {\n      setUpdatingReceiptId(null);\n    }\n  }\n\n'''
          replace_once(
              '  async function handleLogin(credentials) {\n',
              handler + '  async function handleLogin(credentials) {\n',
              'receipt visibility handler',
          )

          register_block = '''  if (isRegisterPage) {\n    return (\n      <AuthPage\n        mode="register"\n        onRegister={handleRegister}\n      />\n    );\n  }\n\n'''
          replace_once(
              register_block,
              register_block + '  if (isReportsPage) {\n    return <ReportsPage />;\n  }\n\n',
              'reports page return',
          )

          replace_once(
              '''            <a\n              className="btn secondary"\n              href="http://localhost:8000/docs"\n''',
              '''            <a\n              className="btn secondary"\n              href="/app/reports"\n            >\n              Reports\n            </a>\n\n            <a\n              className="btn secondary"\n              href="http://localhost:8000/docs"\n''',
              'reports navigation link',
          )

          old_visibility = '''                  <span\n                    className={`visibility-badge ${\n                      receipt.is_public\n                        ? "public"\n                        : "private"\n                    }`}\n                  >\n                    {receipt.is_public\n                      ? "Public"\n                      : "Private"}\n                  </span>\n'''
          new_visibility = '''                  <div className="entry-actions">\n                    <span\n                      className={`visibility-badge ${\n                        receipt.is_public\n                          ? "public"\n                          : "private"\n                      }`}\n                    >\n                      {receipt.is_public\n                        ? "Public"\n                        : "Private"}\n                    </span>\n\n                    <button\n                      type="button"\n                      className="profile-edit-button"\n                      disabled={updatingReceiptId === receipt.id}\n                      onClick={() =>\n                        handleToggleReceiptVisibility(receipt)\n                      }\n                    >\n                      {updatingReceiptId === receipt.id\n                        ? "Saving..."\n                        : receipt.is_public\n                          ? "Make private"\n                          : "Make public"}\n                    </button>\n                  </div>\n'''
          replace_once(old_visibility, new_visibility, 'receipt visibility controls')

          path.write_text(text)

          readme = Path('README.md')
          readme_text = readme.read_text()
          milestone = '''## Current Development Milestone\n\n### Impact Receipts V1 — Complete\n\n- [x] Complete editable-profile persistence testing\n- [x] Display saved profile information on public profiles\n- [x] Remove remaining hardcoded public-profile identity and links\n- [x] Create the first Impact Receipt backend model\n- [x] Convert an existing brag entry into an Impact Receipt\n- [x] Add a **Create Impact Receipt** action to entries\n- [x] Display the first Impact Receipt card\n- [x] Add receipt visibility controls\n- [x] Add receipt creation and update timestamps\n- [x] Expose public receipts without leaking private evidence\n\n### Reports Hub V1 — Complete\n\n- [x] Add a dedicated Reports Hub at `/app/reports`\n- [x] Add combined weekly reporting for entries and Impact Receipts\n- [x] Add an all-time career summary\n- [x] Add custom start/end date reports\n- [x] Base report periods on `entry_date` with timestamp fallback for older records\n- [x] Summarize accomplishments, receipts, evidence, confirmations, and public proof\n- [x] Summarize skills, categories, entry types, and trust signals\n- [x] Surface quantified results, career highlights, and reusable résumé bullets\n- [x] Add automated coverage for reports, profile persistence, receipt visibility, and public-evidence privacy\n\n---\n\n## Roadmap'''
          updated, count = re.subn(
              r'## Current Development Milestone.*?---\n\n## Roadmap',
              milestone,
              readme_text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace README milestone section')
          readme.write_text(updated)
          PY

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit branch patch and remove temporary workflow
        run: |
          rm .github/workflows/reports-hub-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Reports Hub into app"
          git push origin feature/reports-hub-v1
